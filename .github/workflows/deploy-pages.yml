name: Deploy redesigned site to GitHub Pages

on:
  push:
    branches:
      - redesign-3d-scroll
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build deployable site
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html style.css scene.js scene-v1.glb .nojekyll dist/
          cp -R www.dr-erdogan.de dist/www.dr-erdogan.de

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
